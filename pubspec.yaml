name: expendly
description: "Expendly - Personal finance management application with modern fiscal design."
publish_to: 'none'

version: 1.2.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  get_it: ^7.6.0
  injectable: ^2.3.2
  auto_route: ^7.8.4
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.3
  rps: ^0.10.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_remote_config: ^5.4.4
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  logger: ^2.7.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.6
  fl_chart: ^1.1.0
  skeletonizer: ^2.1.3
  open_file: ^3.5.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  local_auth: ^2.3.0
  share_plus: ^12.0.2
  google_mobile_ads: ^9.0.0
  firebase_crashlytics: ^4.3.10
  dio: ^5.7.0

  pointycastle: any
dependency_overrides:
  vector_math: 2.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  injectable_generator: ^2.4.1
  auto_route_generator: ^7.3.2
  flutter_launcher_icons: ^0.13.1
  flutter_gen_runner: 5.4.0

  path_provider_platform_interface: any
  plugin_platform_interface: any
flutter_gen:
  output: lib/core/gen/
  line_length: 120

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/expendly_icon.png
    - assets/images/expendly_logo.png
    - assets/images/expendly_logo_light.png
    - assets/google_fonts/
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/google_fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/JetBrainsMono-Bold.ttf
          weight: 700

scripts:
  generator:
    build: dart run build_runner build --delete-conflicting-outputs
  build:
    android:
      $before: flutter pub get
      apk: flutter build apk --release --target-platform android-arm64
      appbundle: flutter build appbundle --release
    ios:
      $before: |
        flutter pub get
        cd ios/
        pod install --repo-update
        cd ..
      ipa: flutter build ipa --release --export-method=ad-hoc
      ios: flutter build ios --release
  buildapk: rps build android apk
  buildios: rps build ios ipa
  distribute:
    dev: cd android && bundle exec fastlane distribute_dev
    qa: cd android && bundle exec fastlane distribute_qa
    prod: cd android && bundle exec fastlane distribute_prod
  reset: |
    flutter clean
    flutter pub get
    find . -name "*.freezed.dart" -delete
    find . -name "*.g.dart" -delete
    rps generator build
  sonarTest: flutter test --machine --coverage > test.output