name: expendly
description: "Expendly - Personal finance management application with modern fiscal design."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  get_it: ^7.6.0
  injectable: ^2.3.2
  auto_route: ^7.8.4
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.3
  rps: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  auto_route_generator: ^7.3.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/google_fonts/
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/google_fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/JetBrainsMono-Bold.ttf
          weight: 700

scripts:
  generator:
    build: dart run build_runner build --delete-conflicting-outputs
  build:
    android:
      $before: flutter pub get
      apk: flutter build apk --release --target-platform android-arm64
      appbundle: flutter build appbundle --release
    ios:
      $before: |
        flutter pub get
        cd ios/
        pod install --repo-update
        cd ..
      ipa: flutter build ipa --release --export-method=ad-hoc
      ios: flutter build ios --release
  buildapk: rps build android apk
  buildios: rps build ios ipa
  reset: |
    flutter clean
    flutter pub get
    find . -name "*.freezed.dart" -delete
    find . -name "*.g.dart" -delete
    rps generator build
  sonarTest: flutter test --machine --coverage > test.output