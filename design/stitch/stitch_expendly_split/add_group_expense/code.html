<style>
        .glow-shadow-primary {
            box-shadow: 0 0 20px rgba(87, 241, 219, 0.3);

            border-radius: theme('borderRadius.xl');

    body {

<body class="bg-background text-on-surface font-body-md min-h-screen selection:bg-primary selection:text-on-primary overflow-x-hidden">
<!-- TopAppBar (Transactional - Hidden Nav Shell Context, but keeping header for action) -->
<header class="w-full sticky top-0 backdrop-blur-xl bg-glass-overlay dark:bg-glass-overlay border-b border-glass-stroke flat no shadows z-50">
<div class="flex items-center justify-between px-container-padding py-base w-full z-50">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary dark:text-primary p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Add Expense</h1>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary dark:text-primary p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</div>
</header>
<main class="max-w-2xl mx-auto p-container-padding pb-32">
<form class="space-y-gutter-md flex flex-col">
<!-- Amount Input (Hero Section) -->
<div class="bento-card flex flex-col items-center justify-center py-10 relative overflow-hidden group">
<!-- Subtle background glow -->
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-xl pointer-events-none"></div>
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-4" for="amount">Amount</label>
<div class="flex items-center text-primary font-display-lg text-display-lg text-5xl">
<span class="mr-2 opacity-80">$</span>
<input autofocus="" class="bg-transparent border-none text-center w-full max-w-[200px] text-5xl focus:ring-0 placeholder:text-surface-bright p-0" id="amount" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Description Input -->
<div class="bento-card">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-stack-tight" for="description">Description</label>
<div class="relative mt-2">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">description</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg leading-5 bg-surface-container-highest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-colors" id="description" placeholder="e.g., Dinner, Taxi..." type="text"/>
</div>
</div>
<!-- Paid By Dropdown -->
<div class="bento-card">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-stack-tight" for="paid_by">Paid By</label>
<div class="relative mt-2">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<select class="block w-full pl-10 pr-10 py-3 text-on-surface bg-surface-container-highest border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm appearance-none transition-colors" id="paid_by">
<option selected="" value="you">You</option>
<option value="alex">Alex</option>
<option value="sarah">Sarah</option>
<option value="mike">Mike</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
</div>
<!-- Split Among Section -->
<div class="bento-card">
<div class="flex justify-between items-center mb-4">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Split Among</label>
<div class="flex items-center space-x-2">
<span class="text-xs text-on-surface-variant">Equally</span>
<button aria-checked="true" class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" role="switch" type="button">
<span aria-hidden="true" class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-on-primary-fixed shadow ring-0 transition duration-200 ease-in-out translate-x-4"></span>
</button>
</div>
</div>
<div class="space-y-2 mt-4">
<!-- Participant 1 -->
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-highest border border-transparent hover:border-glass-stroke transition-all cursor-pointer group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-sm">
                                Y
                            </div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">You</span>
</div>
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary bg-surface-container-highest focus:ring-primary focus:ring-offset-background" type="checkbox"/>
</label>
<!-- Participant 2 -->
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-highest border border-transparent hover:border-glass-stroke transition-all cursor-pointer group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center font-bold text-sm">
                                A
                            </div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">Alex</span>
</div>
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary bg-surface-container-highest focus:ring-primary focus:ring-offset-background" type="checkbox"/>
</label>
<!-- Participant 3 -->
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-highest border border-transparent hover:border-glass-stroke transition-all cursor-pointer group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-surface-bright text-on-surface flex items-center justify-center font-bold text-sm">
                                S
                            </div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">Sarah</span>
</div>
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary bg-surface-container-highest focus:ring-primary focus:ring-offset-background" type="checkbox"/>
</label>
<!-- Participant 4 -->
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-highest border border-transparent hover:border-glass-stroke transition-all cursor-pointer group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-surface-bright text-on-surface flex items-center justify-center font-bold text-sm">
                                M
                            </div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">Mike</span>
</div>
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary bg-surface-container-highest focus:ring-primary focus:ring-offset-background" type="checkbox"/>
</label>
</div>
</div>
<!-- Sticky Action Button Area (mobile) -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background/90 to-transparent z-40 md:relative md:bg-none md:p-0 md:mt-8">
<button class="w-full bg-primary text-on-primary-fixed py-4 rounded-xl font-title-lg text-title-lg glow-shadow-primary hover:opacity-90 active:scale-95 transition-all" type="submit">
                    Save Expense
                </button>
</div>
</form>
</main>
</body></html>
