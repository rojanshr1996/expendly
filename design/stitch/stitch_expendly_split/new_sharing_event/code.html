<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="w-full sticky top-0 backdrop-blur-xl border-b border-glass-stroke bg-glass-overlay dark:bg-glass-overlay flex items-center justify-between px-container-padding py-base z-50">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">New Event</h1>
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -mr-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<main class="px-container-padding py-6 max-w-3xl mx-auto space-y-gutter-md pb-24 md:pb-6">
<!-- Header Section -->
<div class="mb-8">
<h2 class="font-display-lg text-display-lg text-primary mb-2">Create a new event</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Set up your event to start splitting expenses with friends.</p>
</div>
<!-- Bento Card: Event Details -->
<div class="bg-surface-container rounded-xl border border-glass-stroke p-container-padding shadow-lg">
<h3 class="font-title-lg text-title-lg text-on-surface mb-6">Event Details</h3>
<div class="space-y-6">
<!-- Event Name Input -->
<div class="glass-input bg-surface-container-highest rounded-lg border border-glass-stroke p-3 transition-all duration-200">
<label class="block font-label-sm text-label-sm text-primary mb-1 uppercase tracking-wider" for="eventName">Event Name</label>
<input class="w-full bg-transparent border-none p-0 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 font-body-md" id="eventName" placeholder="e.g. Weekend Trip to Tahoe" type="text"/>
</div>
<!-- Category Selection -->
<div>
<label class="block font-label-sm text-label-sm text-primary mb-3 uppercase tracking-wider">Category</label>
<div class="flex overflow-x-auto no-scrollbar gap-3 pb-2 -mx-container-padding px-container-padding md:mx-0 md:px-0">
<!-- Active Category -->
<button class="flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-xl bg-primary/10 border border-primary text-primary transition-transform active:scale-95">
<span class="material-symbols-outlined text-[28px] mb-1" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
<span class="font-label-sm text-label-sm">Trip</span>
</button>
<!-- Inactive Categories -->
<button class="flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-xl bg-surface-container-highest border border-glass-stroke text-on-surface-variant hover:text-primary hover:border-primary/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] mb-1">restaurant</span>
<span class="font-label-sm text-label-sm">Dinner</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-xl bg-surface-container-highest border border-glass-stroke text-on-surface-variant hover:text-primary hover:border-primary/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] mb-1">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-xl bg-surface-container-highest border border-glass-stroke text-on-surface-variant hover:text-primary hover:border-primary/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] mb-1">celebration</span>
<span class="font-label-sm text-label-sm">Party</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-xl bg-surface-container-highest border border-glass-stroke text-on-surface-variant hover:text-primary hover:border-primary/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] mb-1">local_gas_station</span>
<span class="font-label-sm text-label-sm">Road Trip</span>
</button>
</div>
</div>
</div>
</div>

</div>

<div class="glass-input flex-1 bg-surface-container-highest rounded-lg border border-glass-stroke p-3">
<input class="w-full bg-transparent border-none p-0 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 font-body-sm" placeholder="Email (optional)" type="email"/>
</div>
<button class="bg-primary/20 hover:bg-primary/30 text-primary border border-primary/30 rounded-lg px-6 py-3 font-label-md text-label-md transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add</span> Add
                </button>
</div>

<!-- Participant 1 -->

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-title-lg font-bold">
                            Y
                        </div>
<div>
<p class="font-body-md text-body-md text-on-surface">You</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Owner</p>
</div>
</div>
</li>

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center font-title-lg font-bold">
                            A
                        </div>
<div>
<p class="font-body-md text-body-md text-on-surface">Alex Mercer</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">alex@example.com</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-2 rounded-full hover:bg-surface-container focus:outline-none">
<span class="material-symbols-outlined text-[20px]">close</span>

</li>

<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-title-lg font-bold">

<p class="font-body-md text-body-md text-on-surface">Sarah Connor</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">sarah.c@example.com</p>

</div>

<span class="material-symbols-outlined text-[20px]">close</span>
