<script>
        // Micro-interaction for the main action button
        document.querySelector('button.btn-press').addEventListener('mousedown', function() {
            this.style.filter = 'brightness(0.9)';
        });
        document.querySelector('button.btn-press').addEventListener('mouseup', function() {
            this.style.filter = 'brightness(1.1)';
        });

        // Simple scroll behavior for horizontal tabs
        const nav = document.querySelector('nav');
        let isDown = false;
        letstartX;
        let scrollLeft;

        nav.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - nav.offsetLeft;
            scrollLeft = nav.scrollLeft;
        });
        nav.addEventListener('mouseleave', () => {
            isDown = false;
        });
        nav.addEventListener('mouseup', () => {
            isDown = false;
        });
        nav.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - nav.offsetLeft;
            const walk = (x - startX) * 2;
            nav.scrollLeft = scrollLeft - walk;
        });
    </script>
