<script>
        // Micro-interaction for feedback
        document.querySelector('button').addEventListener('mousedown', function() {
            this.style.transform = 'scale(0.96)';
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.style.transform = 'scale(1)';
        });
        
        // Add subtle mouse-tracking parallax to the atmospheric background
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            const glow = document.querySelector('.bg-primary\\/5');
            if(glow) {
                glow.style.transform = `translate(calc(-50% + ${x * 40}px), ${y * 40}px)`;
            }
        });
    </script>
