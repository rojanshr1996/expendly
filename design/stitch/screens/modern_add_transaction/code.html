<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scroll-hide::-webkit-scrollbar {
            display: none;
        }
        body {
            min-height: 100dvh;
        }
        .toggle-switch-shadow {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

<body class="bg-background text-on-background font-body-md selection:bg-primary-container/30">
<!-- Top AppBar -->
<header class="w-full top-0 sticky backdrop-blur-xl bg-surface/90 border-b border-outline-variant/20 z-50 flex justify-between items-center px-container-padding h-16">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-lg hover:bg-surface-variant transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Log Transaction</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-lg hover:bg-surface-variant transition-colors text-primary">
<span class="material-symbols-outlined">save</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto">
<!-- Transaction Type Toggle -->
<div class="px-container-padding pt-base pb-base">
<div class="relative flex bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-1.5 toggle-switch-shadow">
<div class="absolute h-[calc(100%-12px)] w-[calc(50%-12px)] bg-semantic-red rounded-lg transition-all duration-300 transform translate-x-0" id="toggleHighlight"></div>
<button class="relative z-10 flex-1 py-2.5 font-semibold text-white transition-colors duration-300" id="expenseToggle">
                    Expense
                </button>
<button class="relative z-10 flex-1 py-2.5 font-semibold text-on-surface-variant transition-colors duration-300" id="incomeToggle">
                    Income
                </button>
</div>
</div>
<!-- Amount Entry Section -->
<section class="flex flex-col items-center justify-center py-10 px-container-padding bg-surface-container-low/30">
<div class="flex items-center gap-2">
<span class="text-headline-lg font-bold text-primary">$</span>
<div class="text-[48px] font-label-md tracking-tighter text-on-surface" id="amountDisplay">0.00</div>
</div>
</section>
<!-- Form Fields Section -->
<section class="px-container-padding space-y-gutter-md mt-base pb-8">
<!-- Category & Subcategory -->
<div class="grid grid-cols-2 gap-inner-component">
<div class="space-y-stack-tight">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider pl-1">Category</label>
<button class="w-full h-14 px-4 flex items-center justify-between rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim bg-primary/10 p-1.5 rounded-lg">shopping_bag</span>
<span class="font-body-md text-on-surface">Shopping</span>
</div>
<span class="material-symbols-outlined text-outline text-lg">unfold_more</span>
</button>
</div>
<div class="space-y-stack-tight">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider pl-1">Subcategory</label>
<button class="w-full h-14 px-4 flex items-center justify-between rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container transition-all">
<span class="font-body-md text-outline">General</span>
<span class="material-symbols-outlined text-outline text-lg">unfold_more</span>
</button>
</div>
</div>
<!-- Date & Note -->
<div class="space-y-stack-tight">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider pl-1">Date</label>
<div class="relative">
<input class="w-full h-14 pl-12 pr-4 rounded-xl border border-outline-variant/20 bg-surface-container-low focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all font-body-md text-on-surface" type="date" value="2023-10-27"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/70">calendar_month</span>
</div>
</div>
<div class="space-y-stack-tight">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider pl-1">Note</label>
<div class="relative">
<input class="w-full h-14 pl-12 pr-4 rounded-xl border border-outline-variant/20 bg-surface-container-low focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all font-body-md text-on-surface placeholder:text-outline/60" placeholder="Optional details..." type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/70">sticky_note_2</span>
</div>
</div>
<!-- Add Receipt -->
<button class="w-full flex items-center justify-center gap-3 py-5 border border-dashed border-outline-variant/50 rounded-xl bg-surface-container-lowest hover:bg-surface-container-low hover:border-primary/40 transition-all group mt-2">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">add_a_photo</span>
<span class="font-medium text-on-surface-variant">Attach Receipt</span>
</button>
</section>
<!-- Numeric Keypad -->
<section class="bg-surface-container-high/40 backdrop-blur-md border-t border-outline-variant/20 rounded-t-[2rem] overflow-hidden">
<div class="grid grid-cols-4 gap-px bg-outline-variant/10">
<!-- Numbers and specific layout matching user's reference -->
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="7">7</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="8">8</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="9">9</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-variant/40 hover:bg-surface-variant active:bg-surface-bright transition-colors text-on-surface-variant" data-val="backspace">
<span class="material-symbols-outlined">backspace</span>
</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="4">4</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="5">5</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="6">6</button>
<button class="keypad-btn flex items-center justify-center bg-semantic-green text-on-primary font-bold transition-all hover:brightness-110 active:scale-95 row-span-3" id="saveTransaction">
<span class="material-symbols-outlined text-[36px] font-bold" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check_circle</span>
</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="1">1</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="2">2</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="3">3</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val=".">.</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="0">0</button>
<button class="keypad-btn py-7 flex items-center justify-center bg-surface-container-high hover:bg-surface-container-highest active:bg-surface-variant transition-colors text-xl font-label-md text-on-surface" data-val="00">00</button>
</div>
</section>
</main>
<script>
        let currentAmount = "0.00";
        let isExpense = true;

        const amountDisplay = document.getElementById('amountDisplay');
        const expenseToggle = document.getElementById('expenseToggle');
        const incomeToggle = document.getElementById('incomeToggle');
        const toggleHighlight = document.getElementById('toggleHighlight');
        const saveBtn = document.getElementById('saveTransaction');

        function updateToggle() {
            if (isExpense) {
                toggleHighlight.style.transform = 'translateX(0)';
                toggleHighlight.style.backgroundColor = '#FB7185'; // semantic-red
                expenseToggle.classList.add('text-white');
                expenseToggle.classList.remove('text-on-surface-variant');
                incomeToggle.classList.add('text-on-surface-variant');
                incomeToggle.classList.remove('text-white');
                saveBtn.style.backgroundColor = '#34D399'; // reset green if needed
            } else {
                toggleHighlight.style.transform = 'translateX(calc(100% + 12px))';
                toggleHighlight.style.backgroundColor = '#34D399'; // semantic-green
                incomeToggle.classList.add('text-white');
                incomeToggle.classList.remove('text-on-surface-variant');
                expenseToggle.classList.add('text-on-surface-variant');
                expenseToggle.classList.remove('text-white');
            }
        }

        expenseToggle.addEventListener('click', () => { isExpense = true; updateToggle(); });
        incomeToggle.addEventListener('click', () => { isExpense = false; updateToggle(); });

        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-val');
                if (!val) return;

                if (val === 'backspace') {
                    let numericValue = currentAmount.replace('.', '').replace(/^0+/, '');
                    numericValue = numericValue.slice(0, -1);
                    if (numericValue === "") numericValue = "0";
                    let num = parseInt(numericValue);
                    currentAmount = (num / 100).toFixed(2);
                } else if (val === '.' || val === '00' || !isNaN(val)) {
                    let cleanValue = currentAmount.replace('.', '').replace(/^0+/, '');
                    if (val !== '.') {
                        cleanValue += val;
                    }
                    if (cleanValue === "" || cleanValue === "00") cleanValue = "0";
                    let num = parseInt(cleanValue);
                    currentAmount = (num / 100).toFixed(2);
                }

                amountDisplay.innerText = currentAmount;
                amountDisplay.classList.add('scale-105', 'text-primary-container');
                setTimeout(() => {
                    amountDisplay.classList.remove('scale-105', 'text-primary-container');
                }, 100);
            });
        });

        // Feedback on general button taps
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn && !btn.classList.contains('keypad-btn')) {
                btn.style.transform = 'scale(0.97)';
                setTimeout(() => btn.style.transform = '', 100);
            }
        });
    </script>
</body></html>
