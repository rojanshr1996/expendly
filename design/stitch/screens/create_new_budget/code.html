<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fiscal - Add Budget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .active-period {
            background-color: #2dd4bf;
            color: #003731;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#2f3634",
                        "on-secondary-fixed": "#07006c",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-primary-fixed": "#00201c",
                        "inverse-surface": "#dde4e1",
                        "primary-container": "#2dd4bf",
                        "inverse-primary": "#006b5f",
                        "error": "#ffb4ab",
                        "outline": "#859490",
                        "surface-container-low": "#161d1b",
                        "surface-tint": "#3cddc7",
                        "semantic-red": "#FB7185",
                        "on-secondary": "#1000a9",
                        "glass-stroke": "rgba(255, 255, 255, 0.1)",
                        "surface-bright": "#333b39",
                        "on-surface-variant": "#bacac5",
                        "on-error-container": "#ffdad6",
                        "surface-lowest": "#0F172A",
                        "primary-fixed": "#62fae3",
                        "on-primary-fixed-variant": "#005047",
                        "primary-fixed-dim": "#3cddc7",
                        "on-primary": "#003731",
                        "on-tertiary-fixed-variant": "#6b3b00",
                        "surface": "#0e1513",
                        "outline-variant": "#3c4a46",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "secondary": "#c0c1ff",
                        "on-error": "#690005",
                        "background": "#0e1513",
                        "error-container": "#93000a",
                        "surface-mid": "#334155",
                        "tertiary-fixed": "#ffdcc0",
                        "on-tertiary": "#4b2800",
                        "tertiary-container": "#ffac5a",
                        "surface-container": "#1a211f",
                        "secondary-container": "#3131c0",
                        "on-tertiary-fixed": "#2d1600",
                        "surface-variant": "#2f3634",
                        "tertiary-fixed-dim": "#ffb875",
                        "surface-container-lowest": "#09100e",
                        "surface-low": "#1E293B",
                        "surface-container-high": "#242b2a",
                        "tertiary": "#ffd1aa",
                        "on-surface": "#dde4e1",
                        "on-secondary-container": "#b0b2ff",
                        "surface-dim": "#0e1513",
                        "inverse-on-surface": "#2b3230",
                        "primary": "#57f1db",
                        "on-primary-container": "#00574d",
                        "on-tertiary-container": "#744000",
                        "on-background": "#dde4e1",
                        "semantic-green": "#34D399",
                        "secondary-fixed": "#e1e0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inner-component": "12px",
                        "base": "8px",
                        "stack-tight": "4px",
                        "gutter-md": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.03em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col">
<!-- Top AppBar (Back Action Context) -->
<header class="bg-background/60 backdrop-blur-xl sticky top-0 w-full z-50 border-b border-glass-stroke">
<div class="flex justify-between items-center px-container-padding py-inner-component w-full">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/30 active:scale-95 transition-all" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Add Budget</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-1 px-container-padding pt-gutter-md pb-32 max-w-lg mx-auto w-full space-y-6">
<!-- Large Numeric Input Section -->
<section class="flex flex-col items-center justify-center py-6">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-2">Limit Amount</label>
<div class="flex items-baseline space-x-2">
<span class="font-headline-lg text-headline-lg text-primary-container">$</span>
<input class="bg-transparent border-none text-center font-headline-lg text-headline-lg-mobile md:text-headline-lg focus:ring-0 w-48 text-on-surface placeholder:text-surface-mid" id="amount-input" placeholder="0.00" type="number"/>
</div>
</section>
<!-- Category Grid Section -->
<section class="space-y-stack-tight">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Select Category</label>
<div class="grid grid-cols-4 gap-3">
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all border-primary/20 bg-primary/10" data-active="true">
<span class="material-symbols-outlined text-primary" data-icon="restaurant" data-weight="fill" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-md text-[10px]">Dining</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="directions_car">directions_car</span>
<span class="font-label-md text-[10px]">Travel</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="shopping_bag">shopping_bag</span>
<span class="font-label-md text-[10px]">Retail</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="home_work">home_work</span>
<span class="font-label-md text-[10px]">Bills</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="sports_esports">sports_esports</span>
<span class="font-label-md text-[10px]">Games</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="medication">medication</span>
<span class="font-label-md text-[10px]">Health</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="fitness_center">fitness_center</span>
<span class="font-label-md text-[10px]">Gym</span>
</button>
<button class="category-btn glass-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_horiz">more_horiz</span>
<span class="font-label-md text-[10px]">Others</span>
</button>
</div>
</section>
<!-- Period Selector -->
<section class="space-y-inner-component">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Renewal Period</label>
<div class="glass-card p-1 rounded-xl flex gap-1">
<button class="period-btn flex-1 py-2 rounded-lg font-label-md text-label-md active-period transition-all" data-period="Weekly">Weekly</button>
<button class="period-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant/30 transition-all" data-period="Monthly">Monthly</button>
<button class="period-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant/30 transition-all" data-period="Yearly">Yearly</button>
</div>
</section>
<!-- Toggle Section -->
<section class="glass-card p-container-padding rounded-xl flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Threshold Alert</span>
<span class="font-body-md text-on-surface-variant text-sm">Notify me when I reach 80%</span>
</div>
<button class="relative inline-flex h-6 w-11 items-center rounded-full bg-surface-mid transition-colors duration-200 focus:outline-none ring-primary/40 focus:ring-2" id="alert-toggle">
<span class="inline-block h-4 w-4 transform rounded-full bg-on-surface-variant transition-transform duration-200 translate-x-1" id="toggle-dot"></span>
</button>
</section>
<!-- Create Button Container -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-background/80 backdrop-blur-md border-t border-glass-stroke md:relative md:bg-transparent md:border-none md:p-0 md:pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-2xl flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(45,212,191,0.2)] hover:scale-[0.98] active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Create Budget
            </button>
</div>
</main>
<script>
        // Simple UI Interaction Logic
        
        // Category Selection
        const catBtns = document.querySelectorAll('.category-btn');
        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => {
                    b.classList.remove('border-primary/20', 'bg-primary/10');
                    const icon = b.querySelector('.material-symbols-outlined');
                    icon.classList.replace('text-primary', 'text-on-surface-variant');
                    icon.style.fontVariationSettings = "'FILL' 0";
                });
                btn.classList.add('border-primary/20', 'bg-primary/10');
                const activeIcon = btn.querySelector('.material-symbols-outlined');
                activeIcon.classList.replace('text-on-surface-variant', 'text-primary');
                activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });

        // Period Selection
        const periodBtns = document.querySelectorAll('.period-btn');
        periodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                periodBtns.forEach(b => {
                    b.classList.remove('active-period');
                    b.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/30');
                });
                btn.classList.add('active-period');
                btn.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/30');
            });
        });

        // Toggle Logic
        const toggle = document.getElementById('alert-toggle');
        const dot = document.getElementById('toggle-dot');
        let isOn = false;

        toggle.addEventListener('click', () => {
            isOn = !isOn;
            if (isOn) {
                toggle.classList.replace('bg-surface-mid', 'bg-primary-container');
                dot.classList.replace('translate-x-1', 'translate-x-6');
                dot.classList.replace('bg-on-surface-variant', 'bg-on-primary-container');
            } else {
                toggle.classList.replace('bg-primary-container', 'bg-surface-mid');
                dot.classList.replace('translate-x-6', 'translate-x-1');
                dot.classList.replace('bg-on-primary-container', 'bg-on-surface-variant');
            }
        });

        // Amount Auto-focus (Optional UX polish)
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('amount-input').focus();
        });
    </script>
</body></html>
