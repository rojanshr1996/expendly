<style>
        body {
            background-color: #0e1513;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; filter: blur(40px); transform: scale(1); }
            50% { opacity: 0.8; filter: blur(60px); transform: scale(1.1); }
        }

        .glow-sphere {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #57f1db 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse-glow 6s infinite ease-in-out;
        }

        .logo-reveal {
            animation: reveal 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes reveal {
            from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .loader-bar {
            width: 0%;
            animation: loading 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .aes-badge {
            animation: fade-in 1s ease-out 1s both;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.6; transform: translateY(0); }
        }
    </style>

<!-- Interactive Layer for Subtle Mouse Movement -->
<script>
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            const spheres = document.querySelectorAll('.glow-sphere');
            spheres.forEach((sphere, index) => {
                const factor = (index + 1) * 2;
                sphere.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
            });
        });

        // Simulating completion of loading
        setTimeout(() => {
            document.body.style.transition = "opacity 0.8s ease-in-out";
            // document.body.style.opacity = "0"; // In real app, this triggers navigation
        }, 3500);
    </script>
