<!-- Interactive Script -->
<script>
        let currentPin = '';
        const pinContainer = document.getElementById('pin-container');
        const dots = pinContainer.querySelectorAll('.pin-dot');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('active');
                    dot.classList.remove('border-outline-variant');
                } else {
                    dot.classList.remove('active');
                    dot.classList.add('border-outline-variant');
                }
            });

            if (currentPin.length === 4) {
                // Simulate verification delay
                setTimeout(() => {
                    handleVerification();
                }, 300);
            }
        }

        function handlePress(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updateDots();
                // Haptic feedback simulation
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            }
        }

        function handleBackspace() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function handleClear() {
            currentPin = '';
            updateDots();
        }

        function handleVerification() {
            // Check for success (mocked)
            const success = true; // In reality check against local storage or API
            
            if (success) {
                // Flash green
                dots.forEach(dot => {
                    dot.style.backgroundColor = '#34D399';
                    dot.style.boxShadow = '0 0 20px rgba(52, 211, 153, 0.6)';
                });
                
                // Navigate after animation
                setTimeout(() => {
                    console.log('Access Granted');
                    // location.href = '/dashboard';
                }, 500);
            } else {
                // Shake effect for error
                pinContainer.classList.add('animate-shake');
                setTimeout(() => {
                    pinContainer.classList.remove('animate-shake');
                    handleClear();
                }, 500);
            }
        }

        // Add custom keyframe for shake
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
            .animate-shake {
                animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
            }
        `;
        document.head.appendChild(style);
    </script>
